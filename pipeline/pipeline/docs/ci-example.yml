name: Protein trait software checks
on:
  push:
    paths: ["pipeline/**", ".github/workflows/plant-protein-trait.yml"]
  pull_request:
    paths: ["pipeline/**", ".github/workflows/plant-protein-trait.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install biopython==1.85
      - run: python -m unittest discover -s tests -v
        working-directory: pipeline
      - run: python llm.py smoke-test --output "${RUNNER_TEMP}/ppt_smoke"
        working-directory: pipeline
